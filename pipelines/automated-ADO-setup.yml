trigger: none

#resources:
#  repositories:
#  - repository: PipelineRepo  # repository name (DO NOT CHANGE THIS VALUE) 
#    type: git
#    name: coe-alm-accelerator-templates  # This is the name of the repo in the current project in Azure Devops that has the pipeline templates. If the repo is in a different project you can specify the project and repo using the format ProjectContainingTheBuildTemplates/RepositoryContainingTheBuildTemplates (https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema?view=azure-devops&tabs=schema%2Cparameter-schema#type)

#variables:
#- group: ${{parameters.variableGroup}}

stages:
- stage: copyRemoteToLocal
  displayName: 'Copy  and CoE template repos to local project'
  jobs:
  - job: copyYourOrg 
    displayName: 'Copy  templates to local' 
    pool:
      vmImage: 'ubuntu-latest'
    steps:
        - checkout: self
          persistCredentials: true
          clean: true 

        - bash: az --version
          displayName: 'Show Azure CLI version'

        - bash: az devops configure --defaults organization=$(System.TeamFoundationCollectionUri) project='$(System.TeamProject)' --use-git-aliases true

        - bash: |
            existingRepos=`az repos list`
            echo $existingRepos
            if [[ $existingRepos == *"YourOrg-Templates"* ]]; then
                echo "##vso[task.setvariable variable=CreateTemplateRepo]No"
                repoUrl=`az repos show -r YourOrg-Templates --query "webUrl" -o tsv`
                echo $repoUrl
                echo "##vso[task.setvariable variable=WEBURL]$repoUrl"
            fi
          displayName: 'Check if YourOrg-Templates repo already exists'
          env:
            AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

        - bash: |
            WEBURL=`az repos create --name 'YourOrg-Templates' | grep -oP '(?<="webUrl": ")[^"]*'`
            echo "##vso[task.setvariable variable=WEBURL]$WEBURL"
          condition: and(succeeded(), ne(variables.CreateTemplateRepo, 'No'))
          displayName: 'Create blank repo for YourOrg-Templates to mirror into'  
          env:
            AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

        - bash: |    
            git config --global user.email ""
            git config --global user.name "$(Build.RequestedFor)"
            
            MY_PAT=${{ parameters.PAT }}
            B64_PAT=$(printf "%s"":$MY_PAT" | base64)
            git -c http.extraHeader="Authorization: Basic ${B64_PAT}" clone --bare https://dev.azure.com/YourOrg/Technical%20Standards/_git/YourOrg-Template-Repository            
            cd YourOrg-Template-Repository.git
            echo $(WEBURL)
            git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" push --mirror $(WEBURL)
            echo "##vso[task.setvariable variable=YourOrgTEMPLATESWEBURL;isoutput=true]$WEBURL"
          name: mirror
          displayName: 'Create mirror of YourOrg templates repo'  
          env:
            AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
  - job: copyCoe
    dependsOn: copyYourOrg
    variables:
      YourOrgTemplatesRepo: $[ dependencies.copyYourOrg.outputs['mirror.YourOrgTEMPLATESWEBURL'] ]  
    displayName: 'Clone CoE templates latest release to local from public GitHub' 
    pool:
      vmImage: 'ubuntu-latest'
    steps:
        - checkout: self
          persistCredentials: true
          clean: true 
        
        - bash: az devops configure --defaults organization=$(System.TeamFoundationCollectionUri) project='$(System.TeamProject)' --use-git-aliases true

        - bash: |
            existingRepos=`az repos list`
            echo $existingRepos
            if [[ $existingRepos == *"coe-alm-accelerator-templates"* ]]; then
                echo "##vso[task.setvariable variable=CreateTemplateRepo]No"
                repoUrl=`az repos show -r coe-alm-accelerator-templates --query "webUrl" -o tsv`
                echo $repoUrl
                echo "##vso[task.setvariable variable=WEBURL]$repoUrl"
            fi
          displayName: 'Check if coe-alm-accelerator-templates repo already exists'
          env:
            AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

        - bash: |
            WEBURL=`az repos create --name 'coe-alm-accelerator-templates' | grep -oP '(?<="webUrl": ")[^"]*'`
            echo "##vso[task.setvariable variable=WEBURL]$WEBURL"
          condition: and(succeeded(), ne(variables.CreateTemplateRepo, 'No'))
          displayName: 'Create blank repo for coe-alm-accelerator-templates to mirror into'  
          env:
            AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

        - bash: |    
            git config --global user.email ""
            git config --global user.name "$(Build.RequestedFor)"
            
            git clone --bare https://github.com/microsoft/coe-alm-accelerator-templates.git            
            cd coe-alm-accelerator-templates.git
            echo $(WEBURL)
            git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" push --mirror $(WEBURL)
            echo "##vso[task.setvariable variable=CoEWEBURL;isoutput=true]$WEBURL"
          name: mirror
          displayName: 'Create mirror of coe-alm-accelerator-templates templates repo'  
          env:
            AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

  - job:
    dependsOn:
    - copyYourOrg 
    - copyCoe
    variables:
      YourOrgTemplatesRepo: $[ dependencies.copyYourOrg.outputs['mirror.YourOrgTEMPLATESWEBURL'] ] 
      coeTemplatesRepo: $[ dependencies.copyCoe.outputs['mirror.CoEWEBURL'] ]   
    displayName: 'Copy YourOrg custom Hooks from YourOrg-Templates into the local CoE repo' 
    pool:
      vmImage: 'ubuntu-latest'
    steps:
        - checkout: self
          persistCredentials: true
          clean: true 
        
        - bash: az devops configure --defaults organization=$(System.TeamFoundationCollectionUri) project='$(System.TeamProject)' --use-git-aliases true

        - bash: |    
            git config --global user.email ""
            git config --global user.name "$(Build.RequestedFor)"

            echo $(YourOrgTemplatesRepo)
            echo $(coeTemplatesRepo)
            
            git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" clone $(YourOrgTemplatesRepo) --single-branch
            git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" clone $(coeTemplatesRepo) --single-branch
            cp -rf YourOrg-Templates/pipelines/Hooks  coe-alm-accelerator-templates/Pipelines/Templates/
            cd coe-alm-accelerator-templates/Pipelines/Templates/Hooks
            git status
            git add .
            git commit -am "Copying YourOrg template Hooks to local coe-alm-accelerator repo"
            git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" push
          name: copyFilesBetweenLocalRepos
          displayName: 'Copy files between local repos'  
          env:
            AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

- stage: setupLocalRepoDirectoryStructure
  displayName: 'Setup standard directory structure in local repo'
  jobs:
  - job: copyYourOrg 
    displayName: 'Setup structure as per repoDirStructure.xml' 
    pool:
      vmImage: 'ubuntu-latest'
    steps:
        - checkout: self
          persistCredentials: true
          clean: true 
          path: localRepo

        - bash: az --version
          displayName: 'Show Azure CLI version'

        - bash: az devops configure --defaults organization=$(System.TeamFoundationCollectionUri) project='$(System.TeamProject)' --use-git-aliases true

        - bash: |
            existingRepos=`az repos list`
            echo $existingRepos
            if [[ $existingRepos == *"YourOrg-Templates"* ]]; then
                echo "##vso[task.setvariable variable=TemplatesExists]Yes"
                repoUrl=`az repos show -r YourOrg-Templates --query "webUrl" -o tsv`
                echo $repoUrl
                echo "##vso[task.setvariable variable=WEBURL]$repoUrl"
            fi
          displayName: 'Check if YourOrg-Templates repo exists'
          env:
            AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

        - powershell: |    
            git config --global user.email ""
            git config --global user.name "$(Build.RequestedFor)"
           
            echo $(WEBURL)
            cd ../
            git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" clone $(WEBURL)
            cd localRepo
            
            function recursivelyCreateFolders($parent)
            {
                foreach ($file in $parent.file) 
                {
                    Write-Host $file.Name
                    If(!(Test-Path $file.Name))
                    {
                      If($file.Name -eq "version.json")
                      {
            @'
            {
              "$schema": "https://raw.githubusercontent.com/dotnet/Nerdbank.GitVersioning/master/src/NerdBank.GitVersioning/version.schema.json",
              "version": "1.0",
              "publicReleaseRefSpec": [
                "^refs/heads/main$",
                "^refs/heads/releases/m\\d+(?:\\.\\d+\\.\\d+)?$"
              ],
              "nugetPackageVersion": {
                "semVer": 2
              },
              "pathFilters": [
                ".",
                ":!version.json",
                ":!data-migration-schema.xml"
              ]
            }
            '@ | Out-File -FilePath version.json
                      }
                      else
                      {
                        New-Item $file.Name -ItemType file
                      }
                    }
                }
                
                foreach ($folder in $parent.dir) 
                {
                    Write-Host $folder.Name
                    If(!(Test-Path $folder.Name))
                    {
                      New-Item $folder.Name -ItemType directory
                    }
                    if($folder.childnodes.count -gt 0)
                    {
                        cd ".\$($folder.Name)"
                        recursivelyCreateFolders($folder)
                        cd ..
                    }
                    
                }
            }

            $doc = New-Object xml
            $doc.Load( (Convert-Path ../YourOrg-Templates/pipelines/configuration/repoDirStructure.xml) )
            recursivelyCreateFolders($doc.root, '')

            Write-Host "Directory structure created."

            git config --global user.email "$(Build.RequestedFor)"
            git config --global user.name "$(Build.RequestedFor)"
            git add -A
            git commit -m "creating standard directory structure as per YourOrg-Templates/pipelines/configuration/repoDirStructure.xml"
            git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" push origin HEAD:main           
          name: create
          condition: and(succeeded(), eq(variables.TemplatesExists, 'Yes'))
          displayName: 'Create directories/files and check in'  
          env:
            AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

