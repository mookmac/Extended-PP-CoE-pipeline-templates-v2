- stage: createVariableGroups
  displayName: 'Create Variable Groups from json templates in repository'
  jobs:
  - job: createPpCommon
    displayName: 'Create pp-common varaible group'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - bash: az devops configure --defaults organization=$(System.TeamFoundationCollectionUri) project='$(System.TeamProject)' --use-git-aliases true
      displayName: 'Set default Azure DevOps organization and project'

    - bash: | 
        AdoVariableGroup="pp-common"
        YourOrgTemplatesRepo=`az repos show --repository YourOrg-Templates --query "webUrl" -o tsv`
        echo $YourOrgTemplatesRepo

        git config --global user.email ""
        git config --global user.name "$(Build.RequestedFor)"
        git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" clone $YourOrgTemplatesRepo
        cd YourOrg-Templates
        WorkspaceFolder=`pwd`

        ConfigurationTemplatesRelativeFolder="/pipelines/configuration/"
        InputFileName="variable-group-template-for-pp-common.txt" # Variables in format key=value space separated pairs. 
        InputAbsolutePath="$WorkspaceFolder$ConfigurationTemplatesRelativeFolder$InputFileName"
        echo $InputAbsolutePath
        AdoVariablesTxt=`cat $InputAbsolutePath`
        echo $AdoVariablesTxt
        echo "##vso[task.setvariable variable=InputAbsolutePath]$InputAbsolutePath"

        AdoVariablesTxt=$(sed 's/<AzureDevOpsProjectId>/\"$(System.TeamProjectId)\"/g' <<< $AdoVariablesTxt)
        #TODO: add other variables here repeating the pattern in line above
        echo $AdoVariablesTxt

        echo "Checking if variable group exists with name: $AdoVariableGroup"
        VariableGroups=`az pipelines variable-group list --group-name $AdoVariableGroup --query '[0].id' -o tsv`
        if [[ -z "$VariableGroups" ]]; then
          echo "Variable group does not exist, creating it"
          VariableGroup=`az pipelines variable-group create --name $AdoVariableGroup --variables AzureDevOpsProjectId=$(System.TeamProjectId) BuildConfiguration=Release --authorize true --description "Common variables for Power Platform environments in this project"  --project '$(System.TeamProject)'`
          echo $VariableGroup
          echo "##vso[task.setvariable variable=VarGrpId;isoutput=true]`az pipelines variable-group list --group-name $AdoVariableGroup --query '[0].id' -o tsv`"
        else
          echo $VariableGroups
          echo "##vso[task.setvariable variable=CreateVarGrp]No"
          echo "##vso[task.setvariable variable=VarGrpId;isoutput=true]$VariableGroups"
        fi

        az pipelines variable-group update --group-id "`az pipelines variable-group list --group-name $AdoVariableGroup --query '[0].id' -o tsv`" --authorize true
      displayName: Initialise pp-common variable group
      name: createGrp
      env:
        AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

    - bash: | 
        echo "Getting variables from variable group ID: $(createGrp.VarGrpId)"
        ExistingVariables=`az pipelines variable-group variable list --group-id $(createGrp.VarGrpId)`
        echo $ExistingVariables

        calculateDefaultVariables() {
            case $1 in
              AzureDevOpsProjectName)
                echo "$(System.TeamProject)"
                ;;
              AzureDevOpsOrganizationURL)
                echo "$(System.CollectionUri)"
                ;;
              AzureDevOpsProjectId)
                echo "$(System.TeamProjectId)"
                ;;
              RepoName)
                echo "$(Build.Repository.Name)"
                ;;
              TenantId)
                echo "${{ parameters.TenantId }}"
                ;;
              *)
                STATEMENTS
                ;;
            esac
        }

        echo "Reading through $(InputAbsolutePath) to add/update library variables"
        old_IFS=$IFS
        IFS='\n'
        while read line || [ -n "$line" ]; do
          key=`echo "$line" | cut -d'=' -f1`
          keyWithQuotes=`echo "\"$key\""`
          value=`echo "$line" | cut -d'=' -f2-`
          echo "Key: $key Value: $value"
          if grep -q "`echo "$keyWithQuotes"`" <<< "$ExistingVariables"; then
            if grep -q '<' <<< "$value"; then
              echo "TODO: case logic here"
              az pipelines variable-group variable update --group-id $(createGrp.VarGrpId) --name "$key" --value "`calculateDefaultVariables "$key"`"
            else
              echo "Updating existing variable: $key"
              az pipelines variable-group variable update --group-id $(createGrp.VarGrpId) --name "$key" --value "$value"
            fi
          else
            if grep -q '<' <<< "$value"; then
              echo "TODO: case logic here"
              az pipelines variable-group variable create --group-id $(createGrp.VarGrpId) --name "$key" --value "`calculateDefaultVariables "$key"`"
            else
              echo "Creating new variable: $key"
              az pipelines variable-group variable create --group-id $(createGrp.VarGrpId) --name "$key" --value "$value"
            fi
          fi
        done < $(InputAbsolutePath)
        IFS=$old_IFS
      displayName: Create/update templated variables in pp-common
      env:
        AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

- stage: ManualConfiguration
  displayName: 'Manual configuration required'
  jobs:
    - job:
      pool: server
      steps:
      - task: ManualValidation@0
        timeoutInMinutes: 1440 # task times out in 1 day
        inputs:
          instructions: 'Please update the Client ID and Client Secret values in the pp-common variable group under the Library option on the DevOps sitenav. These values come from your app registration in portal.azure.com.'
          onTimeout: 'resume'

- stage: setupServiceConn
  displayName: 'Setup PP Service Connections'
  jobs:
  - job:
    displayName: 'Create PP Service Connection'
    pool:
      vmImage: 'windows-latest'
    steps:

    - powershell: |
        az devops configure --defaults organization=$(System.TeamFoundationCollectionUri) project='$(System.TeamProject)' --use-git-aliases true
        $endPoints = az devops service-endpoint list -o tsv
        Write-Host $endPoints

        if($endPoints -match "Power Platform Environment Manager")
        {
          Write-Host "Power Platform Environment Manager service connection already exists in this project. Skipping create."
          exit 0
        }

        $YourOrgTemplatesRepo = az repos show --repository YourOrg-Templates --query "webUrl" -o tsv
        git config --global user.email ""
        git config --global user.name "$(Build.RequestedFor)"
        git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" clone $YourOrgTemplatesRepo

        $AdoOrganizationUrl = "$(System.TeamFoundationCollectionUri)" # e.g. "https://dev.azure.com/YourOrg/"
        $AdoProjectName = "$(System.TeamProject)" # e.g. "YourOrg-"
        $AdoProjectId = "$(System.TeamProjectId)" # e.g. "12345678-abcd-1234-123a-123456a1b2c3"
        $PPEnvUrl = "https://xxx.crm11.dynamics.com" # "$(newServiceConnectionUrl)" # e.g. "https://myFirstDynamics.crm11.dynamics.com/"
        
        $TenantId = "${{ parameters.TenantId }}"
        $ClientId = "${{ parameters.ClientId }}"
        $ClientSecret = "${{ parameters.ClientSecret }}"
        
        $DateTimeNow = Get-Date
        $DateTimeUtcNow = $DateTimeNow.ToUniversalTime()
        $FileSuffix = '{0:yyMMdd-HHmm-sss}' -f $DateTimeUtcNow
        
        $WorkspaceFolder = "$(Build.SourcesDirectory)\" # e.g. "C:\YourOrgPlatform\YourOrg-CustomerPlatform\"
        $ConfigurationTemplatesRelativeFolder = "YourOrg-Templates/pipelines/configuration/" # "parameters.configurationTemplateBasePath"
        $InputFileName = "powerplatform-spn-template.json"
        $OutputFolderPath = "temp"
        $OutputFileName = "powerplatform-spn-template-" + $FileSuffix + ".json"
        $InputAbsolutePath = [IO.Path]::Combine($WorkspaceFolder, $ConfigurationTemplatesRelativeFolder, $InputFileName)
        $OutputAbsoluteFolderPath = [IO.Path]::Combine($WorkspaceFolder, $OutputFolderPath)
        $OutputAbsoluteFilePath = [IO.Path]::Combine($OutputAbsoluteFolderPath, $OutputFileName)
        
        $UpdatedServiceConnectionConfig = Get-Content -Raw -Path $InputAbsolutePath
        
        $UpdatedServiceConnectionConfig = $UpdatedServiceConnectionConfig -replace '<TenantId>', $TenantId
        $UpdatedServiceConnectionConfig = $UpdatedServiceConnectionConfig -replace '<ApplicationId>', $ClientId
        $UpdatedServiceConnectionConfig = $UpdatedServiceConnectionConfig -replace '<ClientSecret>', $ClientSecret
        $UpdatedServiceConnectionConfig = $UpdatedServiceConnectionConfig -replace '<ServiceEndpointName>', "Power Platform Environment Manager"
        $UpdatedServiceConnectionConfig = $UpdatedServiceConnectionConfig -replace '<ProjectId>', $AdoProjectId
        $UpdatedServiceConnectionConfig = $UpdatedServiceConnectionConfig -replace '<ProjectName>', $AdoProjectName
        $UpdatedServiceConnectionConfig = $UpdatedServiceConnectionConfig -replace '<PowerPlatformEnvironmentURL>', $PPEnvUrl
        
        #$UpdatedServiceConnectionConfig
        $AdoVariables = $UpdatedServiceConnectionConfig | ConvertFrom-Json
        
        If (-Not(Test-Path $OutputAbsoluteFolderPath)) {
            Write-Host "Creating output folder: $OutputAbsoluteFolderPath"
            New-Item -Path $WorkspaceFolder -Name $OutputFolderPath -ItemType "directory"
        }
        
        Write-Host "Writing updated service configuration to: $OutputAbsoluteFilePath"
        $UpdatedServiceConnectionConfig | Set-Content -Path $OutputAbsoluteFilePath
        #az devops configure --list
        
        az devops configure --defaults organization=$(System.TeamFoundationCollectionUri) project='$(System.TeamProject)' --use-git-aliases true
        
        $NewServiceEndpoint = az devops service-endpoint create --organization $AdoOrganizationUrl --project $AdoProjectName --service-endpoint-configuration $OutputAbsoluteFilePath
        $NewServiceEndpointAsJSON = $NewServiceEndpoint | ConvertFrom-Json
        $NewServiceEndpointId = $NewServiceEndpointAsJSON.id
        az devops service-endpoint update --id $NewServiceEndpointId --enable-for-all
        Write-Host "##vso[task.setvariable variable=NewServiceEndpointId;]$NewServiceEndpointId"
      env:
        AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

- stage: importWiki
  displayName: 'Import Wiki'
  jobs:
  - job:
    displayName: 'Import Wiki as code from YourOrg'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - bash: az devops configure --defaults organization=$(System.TeamFoundationCollectionUri) project='$(System.TeamProject)' --use-git-aliases true
      displayName: 'Set default Azure DevOps organization and project'

    - bash: |         
        existingWikis=`az devops wiki list --query []."name" -o tsv`
        if [[ $existingWikis == *"YourOrg Wiki"* ]]; then
          echo "YourOrg Wiki already created. Updates will reflect automatically when the content in the repo is updated."
        else
          echo "Creating YourOrg Wiki from the code in YourOrg-Templates repo"
          az devops wiki create --name "YourOrg Wiki" --type codewiki --repository YourOrg-Templates --mapped-path /wikis --version main --output table
        fi
      displayName: Create the Wiki
      env:
        AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

- stage: createPPEnvironments
  displayName: 'Create Power Platform Environments'
  jobs:
  - job:
    displayName: 'Run PP - Create PP Environment pipeline for each object in newEnvironments parameter'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - bash: az devops configure --defaults organization=$(System.TeamFoundationCollectionUri) project='$(System.TeamProject)' --use-git-aliases true
      displayName: 'Set default Azure DevOps organization and project'

    - ${{ each newEnv in parameters.newEnvironments }}:
      - bash: |         
          az pipelines run --name "PP - Create PP Environment" --parameters createenv=true environmentType=${{ newEnv.environmentType }} envdisplayname='${{ newEnv.displayName }}' envdomainname=${{ newEnv.url }} envlocation=${{ parameters.envlocation }} envcurrency=${{ parameters.envcurrency }} D365AppsToDeploy=${{ parameters.D365AppsToDeploy }} variableGroup=pp-common ServiceConnection="Power Platform Environment Manager" ServiceConnectionUrl=https://xxx.crm11.dynamics.com
        displayName: Run PP - Create PP Environment pipeline for ${{ newEnv.url }}
        env:
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
