#  type: string
#  default: ''

#- name: AzureSubscriptionName
#  displayName: 'Azure Subscription Name'
#  type: string
#  default: ''

- name: newEnvironments
  displayName: 'New PP Environments'
  type: object
  default: 
    - url: pp-dev-env
      displayName: 'PP Dev'
      environmentType: 'Dev'
    - url: pp-sit-env
      displayName: 'PP SIT'
      environmentType: 'SIT'
    - url: pp-uat-env
      displayName: 'PP UAT'
      environmentType: 'UAT'
    - url: pp-prod-env
